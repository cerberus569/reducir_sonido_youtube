name: Build APK

# Se ejecuta automáticamente cada vez que subes cambios a main/master,
# y también se puede lanzar a mano desde la pestaña "Actions" en GitHub
# (botón "Run workflow"), sin necesidad de computadora ni Android Studio.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El repo tiene gradle-wrapper.jar excluido por el .gitignore (regla
      # "*.jar"), así que ./gradlew no puede arrancar. En vez de depender del
      # wrapper, instalamos Gradle directamente con esta acción y lo usamos
      # tal cual (misma versión que gradle-wrapper.properties: 8.13).
      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
